; =============================================================================
;  CanSat Zénit — Carga SECUNDARIA (ESP32-C3 SuperMini + RFM95W + GPS NEO-6M)
; =============================================================================
[env:secundaria]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1            ; el SuperMini usa el mismo chip ESP32-C3 (4 MB)
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
board_build.flash_mode = dio
; El SuperMini no tiene chip USB-serie: el monitor va por el USB nativo del C3.
; (RadioLib avisa "Use of USB CDC for debug..." al compilar: es normal, no se usa sleep.)
build_flags =
    -Wall
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_extra_dirs = ../comun
lib_ignore = ZenitSensores, ZenitPantalla
lib_deps =
    jgromes/RadioLib@^7.8.1
    mikalhart/TinyGPSPlus@^1.0.3
