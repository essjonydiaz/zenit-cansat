; =============================================================================
;  CanSat Zénit — Carga PRIMARIA
;  Abrir esta carpeta (o zenit.code-workspace) en VS Code con PlatformIO.
;
;  Entornos:
;    primaria      -> firmware de vuelo con sensores reales
;    primaria_sim  -> mismo firmware, pero con vuelo SIMULADO (solo el ESP32)
;    native        -> pruebas de la lógica en la PC:  pio test -e native
; =============================================================================

[platformio]
default_envs = primaria

[esp32_base]
platform = espressif32@6.9.0          ; núcleo Arduino-ESP32 2.0.17
board = esp32dev                      ; ESP32 DevKit V1 (WROOM-32)
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time
lib_extra_dirs = ../comun
lib_deps =
    adafruit/Adafruit BMP280 Library@^2.6.8
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    sandeepmistry/LoRa@^0.8.0
    madhephaestus/ESP32Servo@^3.0.5
    mikalhart/TinyGPSPlus@^1.0.3
build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=1

[env:primaria]
extends = esp32_base

[env:primaria_sim]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -DZENIT_SIMULACION

[env:native]
platform = native
lib_extra_dirs = ../comun
lib_compat_mode = off
test_framework = unity
build_flags = -std=c++17 -Wall
