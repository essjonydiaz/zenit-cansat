; =============================================================================
;  CanSat Zénit — Carga PRIMARIA  (Heltec WiFi LoRa 32 V3 = ESP32-S3 + SX1262)
;  Abrir esta carpeta (o zenit.code-workspace) en VS Code con PlatformIO.
;
;  Entornos:
;    primaria      -> firmware de vuelo con sensores reales
;    primaria_sim  -> mismo firmware, pero con vuelo SIMULADO (solo la placa)
;    native        -> pruebas de la lógica en la PC:  pio test -e native
; =============================================================================

[platformio]
default_envs = primaria

[heltec_base]
platform = espressif32@6.9.0          ; núcleo Arduino-ESP32 2.0.17
board = heltec_wifi_lora_32_V3        ; ESP32-S3FN8, 8 MB flash, USB por CP2102
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time
lib_extra_dirs = ../comun
lib_deps =
    jgromes/RadioLib@^7.8.1
    adafruit/Adafruit BMP280 Library@^2.6.8
    adafruit/Adafruit Unified Sensor@^1.1.14
    madhephaestus/ESP32Servo@^3.0.5
    mikalhart/TinyGPSPlus@^1.0.3
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.1
build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=1

[env:primaria]
extends = heltec_base

[env:primaria_sim]
extends = heltec_base
build_flags =
    ${heltec_base.build_flags}
    -DZENIT_SIMULACION

[env:native]
platform = native
lib_extra_dirs = ../comun
lib_compat_mode = off
lib_ignore = ZenitRadio, ZenitPantalla, ZenitSensores
test_framework = unity
build_flags = -std=c++17 -Wall
