; =============================================================================
;  CanSat Zénit — RECEPTOR de la estación terrena (ESP32 + LoRa por USB)
; =============================================================================
[env:receptor]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time
lib_extra_dirs = ../comun
lib_deps =
    sandeepmistry/LoRa@^0.8.0
build_flags = -Wall
