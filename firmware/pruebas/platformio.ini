; =============================================================================
;  CanSat Zénit — Programas de PRUEBA (calendario P1–P9 del CoDR)
;  Cada entorno compila UN solo archivo de src/. En VS Code: barra de
;  PlatformIO -> elegir el entorno (env:p1_autodiagnostico, etc.) -> Upload
;  -> Monitor.   Detalle y criterios de aceptación: docs/05-plan-de-pruebas.md
; =============================================================================
[platformio]
default_envs = p1_autodiagnostico

[base]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time
lib_extra_dirs = ../comun
lib_deps =
    adafruit/Adafruit BMP280 Library@^2.6.8
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    sandeepmistry/LoRa@^0.8.0
    madhephaestus/ESP32Servo@^3.0.5
    mikalhart/TinyGPSPlus@^1.0.3
build_flags = -Wall

; P1 — Continuidad y encendido: detecta cada módulo y dice PASA / FALLA
[env:p1_autodiagnostico]
extends = base
build_src_filter = +<p1_autodiagnostico.cpp>

; P2 — Calibración de sensores (BMP280 / MPU6050): lecturas y ruido
[env:p2_sensores]
extends = base
build_src_filter = +<p2_sensores.cpp>

; P3 — Alcance LoRa: transmite tramas R numeradas (medir pérdidas y RSSI)
[env:p3_alcance_lora]
extends = base
build_src_filter = +<p3_alcance_lora.cpp>

; P4 — Autonomía de batería: registra voltaje contra tiempo
[env:p4_bateria]
extends = base
build_src_filter = +<p4_bateria.cpp>

; P6 — Mecanismo de desacople: mueve el servo y ajusta ángulos
[env:p6_servo]
extends = base
build_src_filter = +<p6_servo.cpp>

; microSD — escritura/lectura y velocidad
[env:p_microsd]
extends = base
build_src_filter = +<p_microsd.cpp>
