; =============================================================================
;  CanSat Zénit — Programas de PRUEBA de la carga primaria (Heltec WiFi LoRa 32 V3)
;  Cada entorno compila UN solo archivo de src/. En VS Code: barra de
;  PlatformIO -> elegir el entorno (env:p1_autodiagnostico, etc.) -> Upload
;  -> Monitor.   Detalle y criterios de aceptación: docs/05-plan-de-pruebas.md
; =============================================================================
[platformio]
default_envs = p1_autodiagnostico

[base]
platform = espressif32@6.9.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time
lib_extra_dirs = ../comun
lib_deps =
    jgromes/RadioLib@^7.8.1
    adafruit/Adafruit BMP280 Library@^2.6.8
    adafruit/Adafruit Unified Sensor@^1.1.14
    madhephaestus/ESP32Servo@^3.0.5
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.1
build_flags = -Wall

; P1 — Continuidad y encendido: detecta cada módulo y dice PASA / FALLA
[env:p1_autodiagnostico]
extends = base
build_src_filter = +<p1_autodiagnostico.cpp>

; P2 — Calibración del GY-91 (ruido, bias del giroscopio, centros de la brújula)
[env:p2_sensores]
extends = base
build_src_filter = +<p2_sensores.cpp>

; P3 — Alcance LoRa: transmite tramas R numeradas (medir pérdidas y RSSI a 1 km)
[env:p3_alcance_lora]
extends = base
build_src_filter = +<p3_alcance_lora.cpp>

; P4 — Autonomía de la pila de 9 V: registra voltaje contra tiempo
[env:p4_bateria]
extends = base
build_src_filter = +<p4_bateria.cpp>

; P5 — OpenLog: 1000 líneas a 25 Hz sin perder ninguna
[env:p5_registro_openlog]
extends = base
build_src_filter = +<p5_registro_openlog.cpp>

; P6 — Servos de desacople y autogiro: ángulos y 20 ciclos
[env:p6_servos]
extends = base
build_src_filter = +<p6_servos.cpp>
