# Compila todos los firmwares y corre las pruebas en cada push / pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  firmware:
    name: Compilar ${{ matrix.proyecto }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        proyecto: [primaria, secundaria, receptor, pruebas]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/*/platformio.ini') }}
      - run: pip install platformio
      - name: Compilar
        run: |
          if [ "${{ matrix.proyecto }}" = "primaria" ]; then
            pio run -d firmware/primaria -e primaria -e primaria_sim
          else
            pio run -d firmware/${{ matrix.proyecto }}
          fi

  logica:
    name: Pruebas de la lógica (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - run: pio test -d firmware/primaria -e native

  estacion:
    name: Estación terrena
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estacion-terrena
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: estacion-terrena/package-lock.json
      - run: npm ci
      - run: npm test

  analisis:
    name: Análisis de vuelo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r herramientas/requirements.txt
      - run: python herramientas/analisis_vuelo.py herramientas/ejemplos/VUELO_SIMULADO.CSV --salida /tmp/resultados
      - run: grep -q "Cumple" /tmp/resultados/resumen.md
